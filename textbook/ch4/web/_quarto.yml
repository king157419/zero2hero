project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - s4-1.qmd
    - s4-2.qmd
    - s4-3.qmd
    - s4-4.qmd
    - s4-5.qmd
    - s4-6.qmd
    - s4-7.qmd
    - exercises.qmd
    - references.qmd

lang: zh

website:
  title: "大模型计算系统"
  description: "《大语言模型原理与技术》第 4 章：大模型计算系统（网页版）"
  page-navigation: true
  search: true
  reader-mode: false
  sidebar:
    style: floating
    collapse-level: 1
    contents:
      - text: "本章导读"
        href: index.qmd
      - text: "4.1　大模型对计算系统的要求"
        href: s4-1.qmd
      - text: "4.2　算力资源"
        href: s4-2.qmd
      - text: "4.3　深度学习框架"
        href: s4-3.qmd
      - text: "4.4　推理服务"
        href: s4-4.qmd
      - text: "4.5　应用系统工具"
        href: s4-5.qmd
      - text: "4.6　综合案例"
        href: s4-6.qmd
      - text: "4.7　本章小结与展望"
        href: s4-7.qmd
      - text: "习题"
        href: exercises.qmd
      - text: "术语与参考文献"
        href: references.qmd
    tools:
      - icon: file-earmark-pdf
        href: 第4章_大模型计算系统.pdf
        text: "下载 PDF 版"

format:
  html:
    theme: [cosmo, book.scss]
    toc: true
    toc-title: "本页目录"
    toc-depth: 2
    number-sections: false
    html-math-method: mathjax
    include-after-body:
      - text: '<script src="toc.js"></script><script src="widgets.js"></script>'
    resources:
      - widgets.js
      - toc.js
      - 第4章_大模型计算系统.pdf
      - figs/*.svg
